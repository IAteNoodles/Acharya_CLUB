services:
  app:
    build:
      context: .
      target: development
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - CORS_ORIGINS=http://localhost:5173,http://localhost:8000
      # DB_PASSWORD and UPSTASH_REDIS_REST_TOKEN are read from .env or system env
    volumes:
      - .:/app
      - /app/__pycache__
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload --proxy-headers
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Local Postgres for development fallback
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: acharya
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acharya"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local Redis for development fallback
  redis:
    image: redis:7-alpine
    profiles: ["local-db"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
